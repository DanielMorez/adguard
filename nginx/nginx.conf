events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP: ACME challenge + редирект на HTTPS
    server {
        listen 80;
        server_name __DOMAIN__;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: reverse proxy на AdGuard Home
    server {
        listen 443 ssl;
        server_name __DOMAIN__;

        ssl_certificate     /etc/nginx/ssl/live/__DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/__DOMAIN__/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            set $adguard_upstream adguardhome:3000;
            proxy_pass http://$adguard_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_read_timeout 86400s;
        }
    }
}
