# =============================================================================
# Nginx: reverse proxy для AdGuard Home + Certbot webroot
# Сценарий:
# 1) До выпуска сертификата работает HTTP на 80
# 2) После выпуска раскомментируйте HTTPS-блок на 443
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Резолвер Docker для динамического резолвинга имён контейнеров
    resolver 127.0.0.11 valid=10s ipv6=off;

    # -------------------------------------------------------------------------
    # HTTP (работает сразу)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        # Замените на ваш домен
        server_name adguard.choomba.tech;

        # Для верификации Certbot (http-01 challenge)
        location ^~ /.well-known/acme-challenge/ {
            # Важно: Certbot пишет файлы в /var/www/certbot/.well-known/acme-challenge/<token>
            # Через root nginx будет искать их по этому же пути.
            root /var/www/certbot;
            allow all;
            default_type "text/plain";
        }

        # После получения сертификата раскомментируйте редирект
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # До включения HTTPS проксируем UI AdGuard через HTTP
        location / {
            set $adguard_upstream adguardhome:80;
            proxy_pass http://$adguard_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_read_timeout 86400s;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS (включить после выпуска сертификата)
    # -------------------------------------------------------------------------
    # server {
    #     listen 443 ssl;
    #     server_name adguard.choomba.tech;
    #
    #     ssl_certificate     /etc/nginx/ssl/live/adguard.choomba.tech/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/live/adguard.choomba.tech/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     location / {
    #         set $adguard_upstream adguardhome:80;
    #         proxy_pass http://$adguard_upstream;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header Upgrade $http_upgrade;
