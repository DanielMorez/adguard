# =============================================================================
# Nginx: reverse proxy для AdGuard Home
# Веб-интерфейс AdGuard доступен на порту 3000 внутри Docker-сети (значение ADGUARD_WEB_PORT в .env).
# Nginx принимает запросы на 80 (HTTP) и 443 (HTTPS) и проксирует их на adguardhome:3000.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Формат логов: IP, пользователь, время, запрос, статус, размер, referer, user-agent
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # -------------------------------------------------------------------------
    # Gzip-сжатие для статики и текстовых ответов (уменьшает трафик к клиенту)
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Резолвер Docker (127.0.0.11). Нужен, чтобы резолвить adguardhome при запросе, а не при старте —
    # иначе nginx падает с "host not found in upstream", если контейнер adguardhome ещё не в сети.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # =========================================================================
    # HTTP — порт 80, работает сразу после запуска
    # Проксирование на веб-интерфейс AdGuard Home (порт 3000 внутри сети)
    # =========================================================================
    server {
        listen 80;
        # Принимать любой Host (доступ по IP и по любому домену). Можно заменить на свой домен, например: server_name dns.home.lan;
        server_name _;

        # После настройки SSL раскомментируйте строку ниже для редиректа на HTTPS:
        # return 301 https://$host$request_uri;

        # ACME challenge для Certbot (webroot).
        # Нужен для выпуска/обновления сертификатов через docker compose run certbot.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        location / {
            set $adguard_upstream adguardhome:3000;
            proxy_pass http://$adguard_upstream;
            proxy_http_version 1.1;

            # Заголовки для корректной работы за reverse proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket — нужен для обновлений UI AdGuard Home в реальном времени
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Таймауты: долгое ожидание для WebSocket и длинных запросов
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 86400s;
        }
    }

    # =========================================================================
    # HTTPS — порт 443 (блок полностью закомментирован, готов к включению)
    # Раскомментируйте весь блок после размещения сертификатов в nginx/certs/
    # Затем раскомментируйте редирект с HTTP на HTTPS в блоке server выше.
    # =========================================================================
    # server {
    #     listen 443 ssl;
    #     # Укажите свой домен (должен совпадать с именем в SSL-сертификате), например: server_name dns.example.com;
    #     server_name _;
    #
    #     # Пути к сертификатам (Let's Encrypt: fullchain.pem + privkey.pem)
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #
    #     location / {
    #         set $adguard_upstream adguardhome:3000;
    #         proxy_pass http://$adguard_upstream;
    #         proxy_http_version 1.1;
    #
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #
    #         proxy_connect_timeout 60s;
    #         proxy_send_timeout 60s;
    #         proxy_read_timeout 86400s;
    #     }
    # }
}
