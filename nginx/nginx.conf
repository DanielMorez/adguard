# =============================================================================
# Nginx: reverse proxy для AdGuard Home + Certbot webroot
# Сценарий:
# 1) До выпуска сертификата работает HTTP на 80
# 2) После выпуска раскомментируйте HTTPS-блок на 443
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Резолвер Docker для динамического резолвинга имён контейнеров
    resolver 127.0.0.11 valid=10s ipv6=off;

    # -------------------------------------------------------------------------
    # HTTP (работает сразу)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        # Замените на ваш домен
        server_name adguard.choomba.tech;

        # Для верификации Certbot (http-01 challenge)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            default_type "text/plain";
        }


        location / {
            return 301 https://$host$request_uri;
        }

        # Прямой доступ к AdGuard через HTTP (без HTTPS).
        # Раскомментируйте этот блок и закомментируйте редирект выше, если нужно отключить HTTPS.
        # location / {
        #     set $adguard_upstream adguardhome:3000;
        #     proxy_pass http://$adguard_upstream;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_connect_timeout 60s;
        #     proxy_read_timeout 86400s;
        # }
    }

    server {
         listen 443 ssl;
         server_name adguard.choomba.tech;

         ssl_certificate     /etc/nginx/ssl/live/adguard.choomba.tech/fullchain.pem;
         ssl_certificate_key /etc/nginx/ssl/live/adguard.choomba.tech/privkey.pem;
         ssl_protocols       TLSv1.2 TLSv1.3;

         location / {
             set $adguard_upstream adguardhome:3000;
             proxy_pass http://$adguard_upstream;
             proxy_http_version 1.1;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
             proxy_set_header Upgrade $http_upgrade;
             proxy_set_header Connection "upgrade";
             proxy_connect_timeout 60s;
             proxy_read_timeout 86400s;
         }
     }
}
